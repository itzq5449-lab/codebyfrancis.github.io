<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pwede pa-kiss?</title>
<style>
    body {
        font-family: "Poppins", Arial, sans-serif;
        text-align: center;
        margin-top: 100px;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        height: 100vh;
        overflow: hidden;
        color: white;
    }

    h1 {
        font-size: 50px;
        text-shadow: 2px 2px 15px rgba(0,0,0,0.25);
    }

    #noBtn, #yesBtn {
        padding: 12px 28px;
        font-size: 22px;
        margin: 20px;
        cursor: pointer;
        position: absolute;
        border-radius: 30px;
        border: none;
        transition: 0.3s ease;
    }

    /* ORIGINAL POSITION KEPT */
    #yesBtn {
        left: 50%;
        transform: translateX(-120%);
        background-color: #ff4d6d;
        color: white;
        box-shadow: 0 6px 15px rgba(255,77,109,0.4);
    }

    #yesBtn:hover {
        background-color: #ff1e4d;
        transform: translateX(-120%) scale(1.1);
    }

    #noBtn {
        left: 50%;
        transform: translateX(20%);
        background-color: white;
        color: #ff4d6d;
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    #noBtn:hover {
        transform: translateX(20%) scale(1.05);
    }

    /* Floating hearts */
    .heart {
        position: fixed;
        bottom: -10px;
        font-size: 20px;
        animation: rise 6s infinite ease-in;
        color: rgba(255,255,255,0.85);
    }

    @keyframes rise {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-110vh) scale(1.8); opacity: 0; }
    }
</style>
</head>
<body>

<h1>Pwede pa-kiss? 😘</h1>

<button id="yesBtn" onclick="alert('Yieee! 😘')">Yes</button>
<button id="noBtn">No</button>

<script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseover", function() {
        const maxX = window.innerWidth - noBtn.offsetWidth - 20;
        const maxY = window.innerHeight - noBtn.offsetHeight - 20;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    // Floating hearts
    setInterval(() => {
        let heart = document.createElement("div");
        heart.innerHTML = "❤️";
        heart.classList.add("heart");
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (18 + Math.random() * 18) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }, 700);
</script>

</body>
</html>
